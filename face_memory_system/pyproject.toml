[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dementia-face-memory"
version = "0.1.0"
description = "Offline face identification and local memory retrieval prototype"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.10,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
]

[project.scripts]
face-memory = "face_memory.cli:main"
face-memory-evaluate = "face_memory.evaluate_cli:main"
face-memory-api = "face_memory.api_cli:main"
face-memory-poster-templates = "face_memory.templates_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
